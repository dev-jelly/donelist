# Cert-Manager Configuration for Automatic TLS Certificate Management
#
# Prerequisites:
# Install cert-manager:
# kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml

---
# ClusterIssuer for Let's Encrypt Production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app: cert-manager
spec:
  acme:
    # Let's Encrypt production server
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@donelist.example.com  # CHANGE THIS to your email
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    # HTTP-01 challenge (default)
    - http01:
        ingress:
          class: nginx
    # DNS-01 challenge (alternative, better for wildcard certs)
    # - dns01:
    #     cloudflare:
    #       email: admin@donelist.example.com
    #       apiTokenSecretRef:
    #         name: cloudflare-api-token
    #         key: api-token

---
# ClusterIssuer for Let's Encrypt Staging (for testing)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app: cert-manager
spec:
  acme:
    # Let's Encrypt staging server (for testing)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@donelist.example.com  # CHANGE THIS to your email
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
    - http01:
        ingress:
          class: nginx

---
# Certificate for Donelist API (alternative to annotation-based)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: donelist-api-cert
  namespace: donelist
  labels:
    app: donelist
spec:
  secretName: donelist-api-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - api.donelist.example.com  # CHANGE THIS to your domain
  # For wildcard certificates, use DNS-01 challenge
  # - "*.donelist.example.com"
  privateKey:
    algorithm: RSA
    size: 2048
  renewBefore: 720h  # 30 days before expiry
  usages:
  - digital signature
  - key encipherment

