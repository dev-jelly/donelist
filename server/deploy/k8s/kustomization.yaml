apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: donelist

# Common labels
commonLabels:
  app: donelist
  managed-by: kustomize

# Resources to include
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - cert-manager.yaml

# ConfigMap generator (alternative to static configmap)
configMapGenerator:
  - name: donelist-config
    literals:
      - SERVER_ENV=production
      - LOG_LEVEL=info

# Secret generator (use sealed-secrets or external-secrets in production)
secretGenerator:
  - name: donelist-secret
    type: Opaque
    literals:
      - DB_PASSWORD=CHANGE_ME
      - REDIS_PASSWORD=CHANGE_ME
      - JWT_SECRET=CHANGE_ME

# Images to substitute
images:
  - name: your-registry/donelist-api
    newName: ghcr.io/your-org/donelist-api
    newTag: latest

# Patches for environment-specific configs
patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: donelist-api
      namespace: donelist
    spec:
      replicas: 2
