# SealedSecret for Donelist API
# This file shows how to use sealed-secrets for secure secret management
#
# Prerequisites:
# 1. Install sealed-secrets controller in your cluster:
#    kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/controller.yaml
#
# 2. Install kubeseal CLI:
#    brew install kubeseal  # macOS
#    # Or download from: https://github.com/bitnami-labs/sealed-secrets/releases
#
# Usage:
# 1. Create a regular secret file (secret-plain.yaml) with your values
# 2. Seal it: kubeseal -f secret-plain.yaml -w sealedsecret.yaml
# 3. Delete the plain secret file: rm secret-plain.yaml
# 4. Commit the sealed secret to git (safe to commit!)
# 5. Apply: kubectl apply -f sealedsecret.yaml

---
# Example: How to create and seal secrets
#
# Step 1: Create a regular secret (DO NOT COMMIT THIS FILE!)
# cat <<EOF > /tmp/donelist-secret-plain.yaml
# apiVersion: v1
# kind: Secret
# metadata:
#   name: donelist-secret
#   namespace: donelist
#   labels:
#     app: donelist
# type: Opaque
# stringData:
#   DB_PASSWORD: "your-actual-db-password"
#   REDIS_PASSWORD: "your-actual-redis-password"
#   JWT_SECRET: "your-actual-jwt-secret-minimum-32-characters"
# EOF
#
# Step 2: Seal the secret
# kubeseal -f /tmp/donelist-secret-plain.yaml -w deploy/k8s/sealedsecret.yaml
#
# Step 3: Clean up plain secret
# rm /tmp/donelist-secret-plain.yaml
#
# Step 4: The sealed secret can now be safely committed to git

---
# PLACEHOLDER SealedSecret (replace with actual sealed values)
# This is just a template showing the structure
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: donelist-secret
  namespace: donelist
  labels:
    app: donelist
    component: api
spec:
  encryptedData:
    # These are EXAMPLE encrypted values - replace with your actual sealed secrets
    # Generated using: echo -n "your-value" | kubeseal --raw --from-file=/dev/stdin --namespace=donelist --name=donelist-secret
    DB_PASSWORD: AgA...  # Replace with actual encrypted value
    REDIS_PASSWORD: AgB...  # Replace with actual encrypted value
    JWT_SECRET: AgC...  # Replace with actual encrypted value
  template:
    metadata:
      name: donelist-secret
      namespace: donelist
      labels:
        app: donelist
        component: api
    type: Opaque

