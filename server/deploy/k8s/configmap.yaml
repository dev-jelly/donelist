# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: donelist-config
  namespace: donelist
  labels:
    app: donelist
    component: api
data:
  # Server Configuration
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  SERVER_ENV: "production"

  # Database Configuration (non-sensitive)
  DB_HOST: "postgres-service.donelist.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "donelist"
  DB_USER: "donelist"
  DB_SSLMODE: "require"
  DB_MAX_CONNECTIONS: "25"
  DB_MAX_IDLE_CONNECTIONS: "5"
  DB_CONNECTION_MAX_LIFETIME: "1h"

  # Redis Configuration (non-sensitive)
  REDIS_HOST: "redis-service.donelist.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # JWT Configuration (non-sensitive)
  JWT_ACCESS_TOKEN_EXPIRY: "15m"
  JWT_REFRESH_TOKEN_EXPIRY: "7d"

  # Security
  CORS_ALLOWED_ORIGINS: "https://donelist.example.com"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
  CORS_ALLOWED_HEADERS: "Accept,Authorization,Content-Type,X-CSRF-Token"
  CORS_EXPOSE_HEADERS: "Link"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_MAX_AGE: "300"

  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_MAX_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "1m"

  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  LOG_OUTPUT: "stdout"

  # Premium Features
  PREMIUM_EDIT_HISTORY_ENABLED: "true"
  PREMIUM_OLD_CHECKIN_EDIT_HOURS: "2"

  # WebSocket Configuration
  WS_MAX_MESSAGE_SIZE: "512"
  WS_WRITE_TIMEOUT: "10s"
  WS_READ_TIMEOUT: "60s"
  WS_PING_PERIOD: "54s"