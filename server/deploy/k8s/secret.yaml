# Secret for sensitive configuration
# IMPORTANT: Replace the base64 encoded values with your actual values
# To encode: echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: donelist-secret
  namespace: donelist
  labels:
    app: donelist
    component: api
type: Opaque
data:
  # Database Password - CHANGE THIS!
  # Example: echo -n "your-secure-password" | base64
  DB_PASSWORD: Y2hhbmdlLXRoaXMtcGFzc3dvcmQ=

  # Redis Password - CHANGE THIS!
  # Example: echo -n "your-redis-password" | base64
  REDIS_PASSWORD: Y2hhbmdlLXRoaXMtcmVkaXMtcGFzc3dvcmQ=

  # JWT Secret - CHANGE THIS!
  # Should be at least 32 characters
  # Example: echo -n "your-super-secret-jwt-key-minimum-32-chars" | base64
  JWT_SECRET: eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1taW5pbXVtLTMyLWNoYXJhY3RlcnM=

  # Stripe Keys (optional, for future use)
  # STRIPE_SECRET_KEY: c2tfdGVzdF8uLi4=
  # STRIPE_WEBHOOK_SECRET: d2hzZWNfLi4u