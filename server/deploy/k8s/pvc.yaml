# PersistentVolumeClaim for PostgreSQL data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: donelist
  labels:
    app: postgres
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard  # Change to your storage class (e.g., gp3, fast-ssd)
  resources:
    requests:
      storage: 20Gi  # Adjust based on your needs
  # Optional: Volume expansion support
  # volumeMode: Filesystem

---
# PersistentVolumeClaim for Redis data (if persistence is enabled)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: donelist
  labels:
    app: redis
    component: cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd  # Use faster storage for Redis
  resources:
    requests:
      storage: 5Gi
  # volumeMode: Filesystem

---
