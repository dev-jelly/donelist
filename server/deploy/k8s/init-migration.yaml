# Init Container Configuration for Database Migrations
# This file demonstrates how to add init containers to the deployment
# for running database migrations before the application starts

---
# Job for one-time database migration (use this for initial setup)
apiVersion: batch/v1
kind: Job
metadata:
  name: donelist-db-migration
  namespace: donelist
  labels:
    app: donelist
    component: migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: donelist
        component: migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: migration
        image: your-registry/donelist-api:latest  # CHANGE THIS
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        - |
          echo "Starting database migration..."
          # Add your migration command here
          # Example with golang-migrate:
          # migrate -path /migrations -database "${DATABASE_URL}" up
          # Or if migration is built into the app:
          # ./donelist migrate up
          echo "Migration completed successfully"
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: donelist-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: donelist-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: donelist-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: donelist-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: donelist-secret
              key: DB_PASSWORD
        - name: DB_SSLMODE
          valueFrom:
            configMapKeyRef:
              name: donelist-config
              key: DB_SSLMODE
        - name: DATABASE_URL
          value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=$(DB_SSLMODE)"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # May need write access for migration tools
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

---
# Deployment with init container for migrations
# This is an alternative approach where migrations run before each pod starts
apiVersion: apps/v1
kind: Deployment
metadata:
  name: donelist-api-with-init
  namespace: donelist
  labels:
    app: donelist
    component: api
    version: v1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: donelist
      component: api
  template:
    metadata:
      labels:
        app: donelist
        component: api
        version: v1.0.0
      annotations:
        # Force rollout on config changes
        checksum/config: "{{ include (print $.Template.BasePath \"/configmap.yaml\") . | sha256sum }}"
        checksum/secret: "{{ include (print $.Template.BasePath \"/secret.yaml\") . | sha256sum }}"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      # Init container for database migrations
      initContainers:
      - name: wait-for-db
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER; do
            echo "PostgreSQL is unavailable - sleeping"
            sleep 2
          done
          echo "PostgreSQL is ready!"
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: donelist-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: donelist-config
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: donelist-config
              key: DB_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: donelist-secret
              key: DB_PASSWORD
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 70  # postgres user in postgres image
          capabilities:
            drop:
            - ALL

      - name: run-migrations
        image: your-registry/donelist-api:latest  # CHANGE THIS
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        - |
          echo "Running database migrations..."
          # Add your migration command here
          # ./donelist migrate up
          echo "Migrations completed"
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: donelist-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: donelist-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: donelist-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: donelist-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: donelist-secret
              key: DB_PASSWORD
        - name: DB_SSLMODE
          valueFrom:
            configMapKeyRef:
              name: donelist-config
              key: DB_SSLMODE
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: migration-tmp
          mountPath: /tmp

      # Main application container
      containers:
      - name: donelist-api
        image: your-registry/donelist-api:latest  # CHANGE THIS
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        envFrom:
        - configMapRef:
            name: donelist-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: donelist-secret
              key: DB_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: donelist-secret
              key: REDIS_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: donelist-secret
              key: JWT_SECRET
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs

      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: migration-tmp
        emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - donelist
              topologyKey: kubernetes.io/hostname

---
# CronJob for periodic migration checks or data maintenance
apiVersion: batch/v1
kind: CronJob
metadata:
  name: donelist-db-maintenance
  namespace: donelist
  labels:
    app: donelist
    component: maintenance
spec:
  schedule: "0 2 * * 0"  # Run every Sunday at 2 AM
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: donelist
            component: maintenance
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
          containers:
          - name: maintenance
            image: your-registry/donelist-api:latest  # CHANGE THIS
            imagePullPolicy: Always
            command:
            - /bin/sh
            - -c
            - |
              echo "Running database maintenance..."
              # Add maintenance tasks here:
              # - Vacuum database
              # - Update statistics
              # - Archive old data
              # - Clean up orphaned records
              echo "Maintenance completed"
            env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: donelist-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: donelist-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: donelist-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: donelist-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: donelist-secret
                  key: DB_PASSWORD
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              runAsUser: 1001
              capabilities:
                drop:
                - ALL

---
# PodDisruptionBudget to ensure minimum availability during migrations
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: donelist-api-pdb
  namespace: donelist
  labels:
    app: donelist
    component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: donelist
      component: api
  unhealthyPodEvictionPolicy: IfHealthyBudget
