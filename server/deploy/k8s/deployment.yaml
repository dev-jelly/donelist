# Deployment for Donelist API server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: donelist-api
  namespace: donelist
  labels:
    app: donelist
    component: api
    version: v1.0.0
spec:
  replicas: 2  # Adjust based on your needs
  selector:
    matchLabels:
      app: donelist
      component: api
  template:
    metadata:
      labels:
        app: donelist
        component: api
        version: v1.0.0
    spec:
      # Service account (create if needed for specific permissions)
      # serviceAccountName: donelist-api

      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      containers:
      - name: donelist-api
        image: your-registry/donelist-api:latest  # CHANGE THIS to your image
        imagePullPolicy: Always

        # Container ports
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP

        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: donelist-config

        # Sensitive environment variables from Secret
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: donelist-secret
              key: DB_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: donelist-secret
              key: REDIS_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: donelist-secret
              key: JWT_SECRET

        # Resource limits and requests
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        # Security context for the container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

        # Volume mounts if needed
        # volumeMounts:
        # - name: tmp
        #   mountPath: /tmp

      # Node affinity (optional)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - donelist
              topologyKey: kubernetes.io/hostname

      # Volumes if needed
      # volumes:
      # - name: tmp
      #   emptyDir: {}

---
# HorizontalPodAutoscaler for automatic scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: donelist-api-hpa
  namespace: donelist
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: donelist-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80