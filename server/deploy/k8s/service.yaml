# Service for Donelist API
apiVersion: v1
kind: Service
metadata:
  name: donelist-api-service
  namespace: donelist
  labels:
    app: donelist
    component: api
spec:
  type: ClusterIP  # Use LoadBalancer for cloud providers
  selector:
    app: donelist
    component: api
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  sessionAffinity: ClientIP  # For WebSocket connections
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600