# Production environment values
global:
  environment: production
  domain: donelist.example.com

replicaCount: 3

image:
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: api.donelist.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: donelist-api-tls
      hosts:
        - api.donelist.example.com

resources:
  limits:
    cpu: 2000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

env:
  SERVER_ENV: "production"
  CORS_ALLOWED_ORIGINS: "https://donelist.example.com"
  LOG_LEVEL: "info"
  DB_MAX_CONNECTIONS: "50"

postgresql:
  enabled: true
  primary:
    persistence:
      size: 50Gi
      storageClass: "fast-ssd"
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi

redis:
  enabled: true
  master:
    persistence:
      size: 10Gi
      storageClass: "fast-ssd"
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceMonitor:
  enabled: true
